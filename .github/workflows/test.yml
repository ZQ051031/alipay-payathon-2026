name: Test
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Chrome smoke
        run: |
          if command -v google-chrome >/dev/null; then npm run smoke; else echo 'Chrome unavailable; smoke skipped'; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-screenshots
          path: artifacts/*.png
